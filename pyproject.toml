[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlang"
version = "0.3.0"
description = "A programming language whose runtime is an LLM + tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stanley Samwel", email = "owinostanley03@gmail.com" }]
keywords = ["llm", "agents", "dsl", "tools", "orchestration", "language"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
llmlang = "llm_lang.__main__:main"
llm_lang = "llm_lang.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_lang*", "language*", "library*", "backends*", "tools*"]
