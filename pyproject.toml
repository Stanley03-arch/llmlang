[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlang"
version = "1.3.1"
description = "A programming language whose runtime is an LLM + tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LlmLang contributors" }]
keywords = ["llm", "agents", "dsl", "tools", "orchestration"]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
llmlang = "llm_lang.__main__:main"
